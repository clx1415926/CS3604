meta:
  name: "12306订单管理_数据接口库"
  version: "1.0.0"
  generated_at: "2025-11-16T00:00:00Z"
  source_doc: "e:\\cs3604\\12306\\12306_订单管理_需求文档.md"
  notes: "对齐 Login_Register_Page/.artifacts 的约定与结构，避免重复设计并便于复用。"

conventions:
  data_format: "JSON (server-side), UTF-8"
  audit: true
  pii_handling:
    - "不保存密码明文，不在日志中记录敏感信息"
    - "身份证、手机号等字段仅在必要范围内可见（脱敏传输/展示）"

enums:
  OrderStatus:
    values: [unpaid, paid, canceled, completed]
    default: unpaid
  TicketType:
    values: [成人票, 学生票]
    default: 成人票
  SeatClass:
    values: [商务座, 一等座, 二等座, 软卧, 硬卧, 无座]
    default: 二等座
  CancelLimit:
    values:
      - limit_per_day: 3
    default: { limit_per_day: 3 }
  ErrorCode:
    values:
      - NO_SEATS_AVAILABLE
      - SEAT_ALREADY_TAKEN
      - LOCK_EXPIRED
      - LOCK_NOT_FOUND
      - ORDER_NOT_FOUND
      - INVALID_ORDER_STATE
      - CANCEL_NOT_ALLOWED
      - CANCEL_RATE_LIMIT_EXCEEDED
      - UNAUTHORIZED
      - FORBIDDEN
      - NETWORK_ERROR
      - SERVER_ERROR

schemas:
  Order:
    description: "车票订单实体（支持多人、多座位）。"
    fields:
      order_id: { type: string, format: uuid }
      user_id: { type: string }
      train_id: { type: string }
      travel_date: { type: date }
      from_station: { type: string }
      to_station: { type: string }
      items:
        type: array
        items:
          type: object
          properties:
            passenger_id: { type: string }
            passenger_name: { type: string }
            ticket_type: { type: TicketType, default: 成人票 }
            seat_class: { type: SeatClass }
            carriage_no: { type: string }
            seat_no: { type: string }
            lock_token: { type: string, required: false }
            price: { type: number }
      price_total: { type: number }
      status: { type: OrderStatus, default: unpaid }
      created_at: { type: datetime }
      updated_at: { type: datetime }

  SeatLock:
    description: "座位锁定令牌（短时有效）。"
    fields:
      lock_token: { type: string, format: uuid }
      train_id: { type: string }
      travel_date: { type: date }
      carriage_no: { type: string }
      seat_no: { type: string }
      seat_class: { type: SeatClass }
      passenger_id: { type: string }
      locked_at: { type: datetime }
      expires_at: { type: datetime }

  SeatMap:
    description: "座位布局与占用信息。"
    fields:
      train_id: { type: string }
      travel_date: { type: date }
      seat_class: { type: SeatClass }
      carriage_no: { type: string }
      seats:
        type: array
        items:
          type: object
          properties:
            seat_no: { type: string }
            column: { type: string, enum: [A, B, C, D, E, F] }
            window: { type: boolean }
            occupied: { type: boolean }
            locked_until: { type: datetime, required: false }

  Contact:
    description: "常用联系人（乘车人）实体。"
    fields:
      passenger_id: { type: string, format: uuid }
      name: { type: string }
      id_type: { type: string }
      id_number: { type: string }
      verified: { type: boolean }
      masked_id_number: { type: string }

  CancellationRecord:
    description: "订单取消记录（计数与限制）。"
    fields:
      user_id: { type: string }
      order_id: { type: string }
      canceled_at: { type: datetime }
      count_today: { type: integer }
      limit_per_day: { type: integer, default: 3 }

  DailyCancellationCounter:
    description: "按用户的每日取消计数。"
    fields:
      user_id: { type: string }
      date: { type: date }
      count: { type: integer }

database_operations:
  - type: Database
    id: DB-GetSeatMap
    description: 获取指定车次/日期/席别的座位布局与占用状态。
    dependencies:
      - none
    acceptanceCriteria:
      - 返回座位数组，包含列标识（A-F）、是否靠窗、占用状态。
      - 支持按车厢号筛选，未指定时返回首选车厢。
    changeLog:
      - date: "2025-11-16"
        description: "初始创建。"

  - type: Database
    id: DB-LockSeat
    description: 为乘客锁定指定座位并签发短期令牌。
    dependencies:
      - DB-GetSeatMap
    acceptanceCriteria:
      - 成功时返回lock_token与过期时间；同座位并发竞争时应原子性失败。
      - 锁定超时自动释放；重复锁定同座位应返回当前锁信息或错误。
    changeLog:
      - date: "2025-11-16"
        description: "初始创建。"

  - type: Database
    id: DB-CreateOrder
    description: 根据座位锁定与乘客信息生成待支付订单。
    dependencies:
      - DB-LockSeat
    acceptanceCriteria:
      - 校验所有lock_token未过期且与乘客/座位匹配；生成订单记录为unpaid。
      - 计算总价并保存订单项明细；写审计日志ORDER_SUBMITTED。
    changeLog:
      - date: "2025-11-16"
        description: "初始创建。"

  - type: Database
    id: DB-GetOrderById
    description: 读取订单详情。
    dependencies:
      - none
    acceptanceCriteria:
      - 返回订单基本信息与订单项明细；不存在时返回ORDER_NOT_FOUND。
    changeLog:
      - date: "2025-11-16"
        description: "初始创建。"

  - type: Database
    id: DB-ListOrdersByStatus
    description: 按状态分页查询订单（未完成/未出行/历史）。
    dependencies:
      - none
    acceptanceCriteria:
      - 支持status in [unpaid, completed, canceled]与即将出行（paid且未出行）。
      - 返回车次、乘客、席位、价格、状态、订票日期等。
    changeLog:
      - date: "2025-11-16"
        description: "初始创建。"

  - type: Database
    id: DB-CancelOrder
    description: 取消未支付订单并释放座位锁。
    dependencies:
      - DB-GetOrderById
      - DB-ReleaseSeat
      - DB-CountDailyCancellations
    acceptanceCriteria:
      - 仅允许取消unpaid状态；成功后写审计日志ORDER_CANCELED。
      - 每日取消次数超过3次时拒绝并返回CANCEL_RATE_LIMIT_EXCEEDED。
    changeLog:
      - date: "2025-11-16"
        description: "初始创建。"

  - type: Database
    id: DB-ReleaseSeat
    description: 释放座位锁并标记可再次预订。
    dependencies:
      - DB-LockSeat
    acceptanceCriteria:
      - 成功释放后座位occupied=false且锁信息清除或过期。
    changeLog:
      - date: "2025-11-16"
        description: "初始创建。"

  - type: Database
    id: DB-CountDailyCancellations
    description: 统计用户当日取消次数（用于限制）。
    dependencies:
      - none
    acceptanceCriteria:
      - 返回当天取消计数；支持原子性递增与读写一致性。
    changeLog:
      - date: "2025-11-16"
        description: "初始创建。"

  - type: Database
    id: DB-ListContacts
    description: 查询当前用户的常用联系人（乘车人）。
    dependencies:
      - none
    acceptanceCriteria:
      - 返回姓名、证件类型、证件号（脱敏）、实名认证状态。
    changeLog:
      - date: "2025-11-16"
        description: "初始创建。"

business_rules:
  - 必须登录后才能预订与管理订单。
  - 选座界面显示列标识A-F，靠窗座位需有窗户图标提示。
  - 锁座有效期短（如120秒），超时自动释放并提示。
  - 订单创建前需至少选择1名乘车人且座位已锁定。
  - 未完成订单列表默认显示，含去支付与取消按钮。
  - 每日取消限制为3次，超过限制需明确提示。
  - 取消成功后返回查询页或刷新订单列表。

security:
  audit_events:
    - SEAT_LOCKED
    - SEAT_RELEASED
    - ORDER_SUBMITTED
    - ORDER_CANCELED
  pii_access_control:
    scopes:
      - admin: full
      - support: masked_view
      - user: own_only