<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>中国铁路12306 - 首页</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!-- 品牌与欢迎语 -->
    <header class="topbar" role="banner" aria-label="品牌与欢迎语">
      <div class="brand">中国铁路12306</div>
      <div class="welcome">欢迎登录12306</div>
    </header>

    <!-- 主视觉与信息区 -->
    <section class="hero" aria-label="服务信息">
      <div class="card">
        <p class="service-hours">购票相关业务每日 5:00 至次日 1:00（周二为 5:00 至 24:00）</p>
        <p class="official-tip">官方 APP 为“铁路12306”，目前铁路未授权其他网站或 APP 开展类似服务内容，请注意辨识。</p>
      </div>
    </section>

    <!-- 功能入口区 -->
    <nav class="actions" aria-label="主要功能入口">
      <a class="btn primary" href="http://localhost:8082/login.html" role="button" aria-label="登录注册">登录注册</a>
      <a class="btn primary" id="link-ticket" href="http://localhost:5173/index.html" role="button" aria-label="车票查询">车票查询</a>
      <button class="btn primary" id="btn-orders" aria-label="订单管理" disabled>订单管理</button>
      <button class="btn" aria-label="乘客管理" disabled>乘客管理</button>
      <button class="btn" aria-label="个人信息" disabled>个人信息</button>
    </nav>

    <!-- 页脚与合规信息 -->
    <footer class="footer" aria-label="友情链接与备案">
      <div class="links" aria-label="友情链接">友情链接：
        <a href="https://www.12306.cn/index/" target="_blank" rel="noreferrer">12306官网</a>
      </div>
      <div class="compliance">备案：京公网安备 XXXXXX 号 / 京ICP备XXXXXX号-1</div>
      <div class="a11y">适老化无障碍服务</div>
    </footer>
  </body>
  <script>
    (function(){
      try {
        var params = new URLSearchParams(window.location.search || '');
        var sid = params.get('sid');
        if (sid) {
          try { localStorage.setItem('SESSION_ID', sid); } catch(e) {}
          var cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }
        var storedSid = sid || (function(){ try { return localStorage.getItem('SESSION_ID'); } catch(e) { return null; } })();
        if (storedSid) {
          fetch('http://localhost:8082/api/v1/auth/session/profile', { headers: { Authorization: 'Bearer ' + storedSid } })
            .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
            .then(function(res){
              if (res.ok && res.data && (res.data.username || res.data.name)) {
                var w = document.querySelector('.welcome');
                if (w) w.textContent = '欢迎，' + (res.data.username || '') + (res.data.name ? '（' + res.data.name + '）' : '');
              }
            })
            .catch(function(){});
        }
        var ticket = document.getElementById('link-ticket');
        if (ticket) {
          var sidForLink = (function(){ try { return localStorage.getItem('SESSION_ID'); } catch(e){ return null; } })();
          if (sidForLink) {
            ticket.href = 'http://localhost:5173/index.html?sid=' + encodeURIComponent(sidForLink);
          }
        }
        var btn = document.getElementById('btn-orders');
        if (btn) {
          btn.removeAttribute('disabled');
          btn.addEventListener('click', function(){
            var sid2 = (function(){ try { return localStorage.getItem('SESSION_ID'); } catch(e) { return null; } })();
            if (sid2) { window.location.href = 'http://localhost:3001/?sid=' + encodeURIComponent(sid2); }
            else { window.location.href = 'http://localhost:8082/login.html'; }
          });
        }
      } catch (e) {}
    })();
  </script>
</html>
