- type: Backend
  id: API-GET-HomeMetadata
  route: GET /api/site/metadata
  description: "返回首页展示所需的元信息：服务时间、官方安全提示、友情链接、版权备案与无障碍入口说明。"
  input:
    type: None
  output:
    success:
      statusCode: 200
      body:
        logoText: string
        welcomeText: string
        serviceHours: string
        officialSafetyTip: string
        friendLinks:
          - { name: string, url: string }
        compliance:
          policeRecord: string
          icpRecord: string
        accessibility:
          elderlyServiceEntry: string
          description: string
    error:
      - statusCode: 500
        body: { error: "Server error." }
  dependencies:
    - DB-GetServiceHours
    - DB-GetSiteMetadata
  acceptanceCriteria:
    - "GET /api/site/metadata 成功返回包含服务时间与官方提示的信息体。"
    - "friendLinks 至少包含铁路相关官方站点条目。"
    - "compliance 内提供公安备案与ICP备案信息。"
    - "返回的 elderlyServiceEntry 与说明用于无障碍入口展示。"
  changeLog:
    - date: "2025-11-13"
      description: "初始创建。"