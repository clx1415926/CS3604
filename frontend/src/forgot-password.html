<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>找回密码 - 12306</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .container { max-width: 960px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .tabs { display: flex; gap: 12px; margin-bottom: 16px; }
    .tabs button { padding: 10px 16px; border: 1px solid #ddd; background: #f8f8f8; cursor: pointer; }
    .tabs button.active { background: #2b7de9; color: #fff; border-color: #2b7de9; }
    .tab { display: none; }
    .tab.active { display: block; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
    label { width: 140px; color: #555; }
    input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .actions { display: flex; gap: 12px; margin-top: 12px; }
    .hidden { display: none !important; }
    #strengthMeter { height: 8px; background: #eee; border-radius: 4px; position: relative; margin-top: 6px; }
    #strengthMeter::after { content: ''; position: absolute; left: 0; top: 0; height: 8px; border-radius: 4px; width: 30%; background: #e74c3c; }
    #strengthMeter.medium::after { width: 60%; background: #f5a623; }
    #strengthMeter.strong::after { width: 90%; background: #2ecc71; }
    #maintenanceTip { color: #d35400; margin: 10px 0; }
    #errorTip { color: #c0392b; }
    #successTip { color: #2ecc71; }
    .note { color: #888; font-size: 12px; }
    /* 步骤指示器 */
    .steps-indicator { list-style: none; display: flex; gap: 8px; margin: 8px 0 16px; padding: 0; }
    .steps-indicator li { padding: 4px 8px; border-radius: 999px; background: #eee; color: #666; font-size: 12px; }
    .steps-indicator li.active { background: #2b7de9; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>找回密码</h1>

    <div id="maintenanceTip" class="hidden">当前处于维护窗口</div>

    <div class="tabs" role="tablist">
      <button id="tab-phone-btn" role="tab" aria-controls="tab-phone" class="active">手机找回</button>
      <button id="tab-email-btn" role="tab" aria-controls="tab-email">邮箱找回</button>
      <button id="tab-face-btn" role="tab" aria-controls="tab-face">人脸识别找回</button>
    </div>

    <!-- 手机找回 -->
    <section id="tab-phone" role="tabpanel" class="tab active">
      <ol id="phoneSteps" class="steps-indicator" aria-label="手机找回步骤">
        <li data-step="1" class="active">填写账户信息</li>
        <li data-step="2">获取验证码</li>
        <li data-step="3">设置新密码</li>
        <li data-step="4">完成</li>
      </ol>
      <div class="row">
        <label for="phone">手机号</label>
        <input id="phone" placeholder="例如：13812345678" />
      </div>
      <div class="row">
        <label for="phoneIdType">证件类型</label>
        <select id="phoneIdType">
          <option value="居民身份证" selected>居民身份证</option>
          <option value="中国护照">中国护照</option>
          <option value="外国护照">外国护照</option>
          <option value="港澳居民居住证">港澳居民居住证</option>
          <option value="台湾居民居住证">台湾居民居住证</option>
        </select>
      </div>
      <div class="row">
        <label for="idNumber">身份证号</label>
        <input id="idNumber" placeholder="例如：110101199001011234" />
      </div>
      <div class="actions">
        <button id="submitAccount" class="secondary">提交账户信息</button>
      </div>
      <div class="actions">
        <button id="sendSms">获取验证码</button>
        <span id="smsCountdown" class="note">(05:00)</span>
      </div>
      <div class="row">
        <label for="smsCode">短信验证码</label>
        <input id="smsCode" placeholder="6位数字" />
      </div>
      <div class="actions">
        <button id="verifySms">验证并继续</button>
      </div>
    </section>

    <!-- 邮箱找回 -->
    <section id="tab-email" role="tabpanel" class="tab">
      <div class="row">
        <label for="email">邮箱</label>
        <input id="email" placeholder="例如：user@example.com" />
      </div>
      <div class="row">
        <label for="emailIdType">证件类型</label>
        <select id="emailIdType">
          <option value="居民身份证" selected>居民身份证</option>
          <option value="中国护照">中国护照</option>
          <option value="外国护照">外国护照</option>
          <option value="港澳居民居住证">港澳居民居住证</option>
          <option value="台湾居民居住证">台湾居民居住证</option>
        </select>
      </div>
      <div class="row">
        <label for="emailIdNumber">证件号码</label>
        <input id="emailIdNumber" placeholder="请输入证件号码" />
      </div>
      <div class="actions">
        <button id="sendEmail">发送邮件</button>
        <span id="emailSentTip" class="note"></span>
      </div>
    </section>

    <!-- 人脸识别找回 -->
    <section id="tab-face" role="tabpanel" class="tab">
      <div class="row">
        <label>二维码</label>
        <img id="qrcode" alt="QR" style="border:1px solid #ddd; width: 140px; height: 140px; object-fit: cover;" />
      </div>
      <div id="qrStatus" class="note">未扫码</div>
      <div class="actions">
        <button id="face-mock-scan">模拟扫码</button>
        <button id="face-mock-confirm">模拟确认</button>
        <button id="face-mock-expire">模拟过期</button>
      </div>
    </section>

    <!-- 新密码设置（共用） -->
    <section id="newPasswordForm" class="hidden">
      <div class="row">
        <label for="newPassword">设置新密码</label>
        <input id="newPassword" placeholder="至少8位，包含大小写字母、数字与特殊字符" />
      </div>
      <div id="strengthMeter" class=""></div>
      <div class="actions">
        <button id="submitNewPassword">提交新密码</button>
      </div>
      <div id="errorTip"></div>
      <div id="successTip"></div>
    </section>

    <div class="actions">
      <a href="/login.html">返回登录</a>
    </div>
  </div>

  <script src="/forgot_password.js"></script>
</body>
</html>
