meta:
  name: "数据校验用例 - 用户登录"
  notes: "校验登录标识、失败锁定与会话策略（已移除验证码与记住登录）"

cases:
  identifier_formats:
    valid_username:
      input: "testuser123"
      expect: match "^[A-Za-z][A-Za-z0-9_]{5,29}$"
    valid_phone:
      input: "13812345678"
      expect: match "^1[3-9]\\d{9}$"
    valid_email:
      input: "user@example.com"
      expect: match "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
    invalid_email:
      input: "bad%mail"
      expect: error LOGIN_IDENTIFIER_INVALID_FORMAT


  lock_policy:
    max_failures: 5
    lock_minutes: 30

  session_policy:
    idle_timeout_minutes: 30