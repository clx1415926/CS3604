meta:
  name: "API 测试用例 - 密码管理"
  base_url: "http://localhost:8080/api/v1"
  notes: "覆盖手机/邮箱/人脸识别找回密码与登录后修改密码的关键场景。"

sequence:
  - id: p01_phone_request_ok
    endpoint: POST /auth/password/phone/request
    request:
      body:
        phone_number: "13812345678"
        id_type: "居民身份证"
        id_number: "110101199001011234"
    expect:
      status: 200
      body:
        status: "sent"
        ttl_minutes: 5

  - id: p02_phone_verify_ok
    endpoint: POST /auth/password/phone/verify
    depends_on: p01_phone_request_ok
    request:
      body:
        phone_number: "13812345678"
        code: "123456"
    expect:
      status: 200
      body:
        reset_token: uuid

  - id: p03_reset_password_ok
    endpoint: POST /auth/password/reset
    depends_on: p02_phone_verify_ok
    request:
      body:
        reset_token: "{{ p02_phone_verify_ok.body.reset_token }}"
        new_password: "NewPass_123"
    expect:
      status: 200
      body:
        success: true

  - id: p04_email_request_ok
    endpoint: POST /auth/password/email/request
    request:
      body:
        email: "user@example.com"
        id_type: "居民身份证"
        id_number: "110101199001011234"
    expect:
      status: 200
      body:
        status: "sent"

  - id: p05_face_start
    endpoint: GET /auth/password/face/start
    request:
      body: {}
    expect:
      status: 200
      body:
        qrcode_id: present
        expires_at: present

  - id: p06_face_status_unscanned
    endpoint: GET /auth/password/face/status
    depends_on: p05_face_start
    request:
      query:
        qrcode_id: "{{ p05_face_start.body.qrcode_id }}"
    expect:
      status: 200
      body:
        status: "unscanned"

  - id: p07_face_confirm
    endpoint: POST /auth/password/face/confirm
    depends_on: p05_face_start
    request:
      body:
        qrcode_id: "{{ p05_face_start.body.qrcode_id }}"
    expect:
      status: 200
      body:
        reset_token: present

  - id: p08_login_then_change_password_success
    endpoint: POST /auth/login
    request:
      body:
        identifier: "testuser123"
        password: "Password123!"
    expect:
      status: 200
      body:
        session_id: uuid

  - id: p09_change_password_success
    endpoint: POST /auth/password/change
    depends_on: p08_login_then_change_password_success
    request:
      headers:
        Authorization: "Bearer {{ p08_login_then_change_password_success.body.session_id }}"
      body:
        old_password: "Password123!"
        new_password: "NewPass_123!"
    expect:
      status: 200
      body:
        success: true

  - id: p10_maintenance_block_phone_request
    endpoint: POST /auth/password/phone/request
    request:
      headers:
        x-simulate-maintenance: "1"
      body:
        phone_number: "13812345678"
        id_type: "居民身份证"
        id_number: "110101199001011234"
    expect:
      status: 503
      error: MAINTENANCE_WINDOW

negative_cases:
  - id: n01_phone_id_mismatch
    endpoint: POST /auth/password/phone/request
    request:
      headers:
        x-dev-id-mismatch: "1"
      body:
        phone_number: "13812345678"
        id_type: "居民身份证"
        id_number: "110101199001011234"
    expect:
      status: 422
      error: PHONE_ID_MISMATCH

  - id: n02_sms_code_mismatch
    endpoint: POST /auth/password/phone/verify
    request:
      body:
        phone_number: "13812345678"
        code: "654321"
    expect:
      status: 400
      error: SMS_CODE_MISMATCH

  - id: n03_sms_code_expired
    endpoint: POST /auth/password/phone/verify
    request:
      headers:
        x-dev-expired: "1"
      body:
        phone_number: "13812345678"
        code: "123456"
    expect:
      status: 400
      error: SMS_CODE_EXPIRED

  - id: n04_email_invalid_format
    endpoint: POST /auth/password/email/request
    request:
      body:
        email: "bad%mail"
        id_type: "居民身份证"
        id_number: "110101199001011234"
    expect:
      status: 400
      error: EMAIL_INVALID_FORMAT

  - id: n05_reset_password_weak
    endpoint: POST /auth/password/reset
    request:
      body:
        reset_token: "dummy"
        new_password: "123456"
    expect:
      status: 400
      error: PASSWORD_WEAK

  - id: n06_change_password_wrong_old
    endpoint: POST /auth/password/change
    depends_on: p08_login_then_change_password_success
    request:
      headers:
        Authorization: "Bearer {{ p08_login_then_change_password_success.body.session_id }}"
      body:
        old_password: "Wrong_123"
        new_password: "NewPass_123!"
    expect:
      status: 401
      error: INVALID_CREDENTIALS

  - id: n07_face_status_expired
    endpoint: GET /auth/password/face/status
    depends_on: p05_face_start
    request:
      headers:
        x-dev-expired: "1"
      query:
        qrcode_id: "{{ p05_face_start.body.qrcode_id }}"
    expect:
      status: 200
      body:
        status: "expired"

  - id: n08_rate_limit_phone_request
    endpoint: POST /auth/password/phone/request
    request:
      body:
        phone_number: "13812345678"
        id_type: "居民身份证"
        id_number: "110101199001011234"
    expect:
      status: 200
    repeat: 1
    final_expect:
      status: 429
      error: SMS_TOO_FREQUENT

  - id: n09_rate_limit_email_request
    endpoint: POST /auth/password/email/request
    request:
      body:
        email: "user@example.com"
        id_type: "居民身份证"
        id_number: "110101199001011234"
    expect:
      status: 200
    repeat: 1
    final_expect:
      status: 429
      error: EMAIL_TOO_FREQUENT

  - id: n10_phone_id_lock_after_three_mismatches
    endpoint: POST /auth/password/phone/request
    request:
      headers:
        x-dev-id-mismatch: "1"
      body:
        phone_number: "13900003333"
        id_type: "居民身份证"
        id_number: "110101199001011234"
    expect:
      status: 422
      error: PHONE_ID_MISMATCH
    repeat: 2
    final_expect:
      status: 403
      error: RESET_LOCKED

  - id: n11_sms_code_reuse
    endpoint: POST /auth/password/phone/verify
    depends_on: p02_phone_verify_ok
    request:
      body:
        phone_number: "13812345678"
        code: "123456"
    expect:
      status: 400
      error: SMS_NOT_SENT

  - id: n12_daily_limit_reached
    endpoint: POST /auth/password/phone/request
    request:
      body:
        phone_number: "13900004444"
        id_type: "居民身份证"
        id_number: "110101199001011234"
    expect:
      status: 200
    repeat: 10
    final_expect:
      status: 429
      error: SMS_DAILY_LIMIT_REACHED