meta:
  name: "前端 UI 测试用例 - 密码管理"
  source: ".artifacts/tests/ui/password_ui_cases.yml"
  notes: "与 .artifacts/tests/ui/password_ui_cases.yml 保持一致，用于前端端到端用例驱动。"

cases:
  - id: ui-p01-phone-reset-flow
    expect: "用户在找回密码页选择手机找回，输入手机号与身份证信息，点击获取验证码，倒计时开始，输入正确验证码后显示设置新密码表单。"
    steps:
      - open: "/forgot-password"
      - click: "tab: 手机找回"
      - input:
          selector: "#phone"
          value: "13812345678"
      - input:
          selector: "#idNumber"
          value: "110101199001011234"
      - click: "#sendSms"
      - assert_text:
          selector: "#smsCountdown"
          text: "(05:00)"
      - input:
          selector: "#smsCode"
          value: "123456"
      - click: "#verifySms"
      - assert_visible: "#newPasswordForm"

  - id: ui-p02-password-strength-meter
    expect: "新密码强度计根据字符类别动态更新，弱密码阻止提交并给出错误提示。"
    steps:
      - input: { selector: "#newPassword", value: "123456" }
      - assert_class: { selector: "#strengthMeter", has: "weak" }
      - click: "#submitNewPassword"
      - assert_text: { selector: "#errorTip", text: "密码强度不足" }
      - input: { selector: "#newPassword", value: "Abc12345" }
      - assert_class: { selector: "#strengthMeter", has: "medium" }
      - input: { selector: "#newPassword", value: "Abc12345!" }
      - assert_class: { selector: "#strengthMeter", has: "strong" }

  - id: ui-p03-email-reset-flow
    expect: "用户选择邮箱找回，验证邮箱格式，提交后提示邮件已发送。"
    steps:
      - click: "tab: 邮箱找回"
      - input: { selector: "#email", value: "bad%mail" }
      - click: "#sendEmail"
      - assert_text: { selector: "#errorTip", text: "邮箱格式不正确" }
      - input: { selector: "#email", value: "user@example.com" }
      - click: "#sendEmail"
      - assert_text: { selector: "#emailSentTip", text: "邮件已发送" }

  - id: ui-p04-face-reset-flow
    expect: "人脸找回显示二维码，状态轮询：未扫码→已扫码→已确认，过期后显示重新获取提示。"
    steps:
      - click: "tab: 人脸识别找回"
      - assert_visible: "#qrcode"
      - assert_text: { selector: "#qrStatus", text: "未扫码" }
      - simulate: { action: "scan_qr" }
      - assert_text: { selector: "#qrStatus", text: "已扫码" }
      - simulate: { action: "confirm_face" }
      - assert_text: { selector: "#qrStatus", text: "已确认" }
      - simulate: { action: "expire_qr" }
      - assert_text: { selector: "#qrStatus", text: "二维码已过期" }

  - id: ui-p05-change-password-after-login
    expect: "用户登录后在个人设置页修改密码，旧密码校验错误时提示，正确时成功提示并要求重新登录。"
    steps:
      - login: { user: "testuser123", pass: "Password123!" }
      - open: "/settings/security"
      - input: { selector: "#oldPassword", value: "Wrong_123" }
      - input: { selector: "#newPassword", value: "NewPass_123!" }
      - click: "#changePassword"
      - assert_text: { selector: "#errorTip", text: "旧密码不正确" }
      - input: { selector: "#oldPassword", value: "Password123!" }
      - click: "#changePassword"
      - assert_text: { selector: "#successTip", text: "密码已修改，请重新登录" }

  - id: ui-p06-maintenance-window
    expect: "维护时找回密码入口显示禁用提示，按钮置灰且不可点击。"
    steps:
      - simulate: { action: "maintenance_on" }
      - open: "/forgot-password"
      - assert_disabled: "#sendSms"
      - assert_text: { selector: "#maintenanceTip", text: "当前处于维护窗口" }
      - simulate: { action: "maintenance_off" }