<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>找回密码 - 12306</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">

  <div class="container" style="max-width: 800px; margin-top: 40px;">
    <div class="login-panel">
      <div class="tabs" role="tablist">
        <button id="tab-face-btn" role="tab" aria-controls="tab-face" class="tab">
          <span class="icon">👤</span> 人脸找回
        </button>
        <button id="tab-phone-btn" role="tab" aria-controls="tab-phone" class="tab active">
          <span class="icon">📱</span> 手机找回
        </button>
        <button id="tab-email-btn" role="tab" aria-controls="tab-email" class="tab">
          <span class="icon">✉️</span> 邮箱找回
        </button>
      </div>

      <!-- 人脸识别 -->
      <section id="tab-face" role="tabpanel" class="tab-content">
        <div class="qr-area">
          <p>请使用12306手机APP扫描下方二维码</p>
          <div class="qr-box">
            <img id="faceQrCode" src="/img/登录与注册/official_app_qr.png" alt="人脸识别二维码" style="width: 160px; height: 160px;"/>
          </div>
          <div id="qrStatus" class="qr-status">等待扫描...</div>
        </div>
      </section>

      <!-- 手机找回 -->
      <section id="tab-phone" role="tabpanel" class="tab-content active">
        <ol id="phoneSteps" class="steps-indicator" aria-label="手机找回步骤">
          <li data-step="1" class="active">填写账户信息</li>
          <li data-step="2">获取验证码</li>
          <li data-step="3">设置新密码</li>
          <li data-step="4">完成</li>
        </ol>

        <!-- Step 1: Fill Account Info -->
        <div id="phone-step-1" class="form-grid">
          <div class="form-row">
            <label for="phone">手机号码</label>
            <div class="field phone-field">
              <select style="width: 80px;"><option>+86</option></select>
              <input id="phone" placeholder="已通过核验的手机号码" />
            </div>
          </div>
          <div class="form-row">
            <label for="phoneIdType">证件类型</label>
            <div class="field">
              <select id="phoneIdType">
                <option value="居民身份证" selected>居民身份证</option>
                <option value="中国护照">中国护照</option>
                <option value="外国护照">外国护照</option>
                <option value="港澳居民居住证">港澳居民居住证</option>
                <option value="台湾居民居住证">台湾居民居住证</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <label for="idNumber">证件号码</label>
            <div class="field">
              <input id="idNumber" placeholder="请输入证件号码" />
            </div>
          </div>
          <div class="form-row">
            <label></label>
            <div class="actions">
              <button id="submitAccount" class="primary">提 交</button>
            </div>
          </div>
        </div>

        <!-- Step 2: Get Verification Code -->
        <div id="phone-step-2" class="form-grid hidden">
          <div class="form-row">
            <label for="phone-display">手机号：</label>
            <div class="field">
                <input id="phone-display" type="text" value="(+86) 18258831355" readonly style="border: none; background: transparent; color: #f60;"/>
            </div>
          </div>
          <div class="form-row">
            <label for="phone-verification-code">请填写手机验证码：</label>
            <div class="field sms-field">
              <input id="phone-verification-code" type="text" />
              <button id="get-phone-code-btn" type="button">获取手机验证码</button>
            </div>
          </div>
          <div class="form-row">
            <label></label>
            <div class="actions">
              <button id="submit-phone-code" class="primary">提 交</button>
            </div>
          </div>
        </div>

        <!-- Step 3: Set New Password -->
        <div id="phone-step-3" class="form-grid hidden">
          <div class="form-row">
            <label for="new-password">新密码：</label>
            <div class="field">
              <input id="new-password" type="password" />
              <div class="hint">需包含字母、数字、下划线中不少于两种且长度不少于6</div>
            </div>
          </div>
          <div class="form-row">
            <label for="confirm-new-password">密码确认：</label>
            <div class="field">
              <input id="confirm-new-password" type="password" />
              <div class="hint">请再次输入密码</div>
            </div>
          </div>
          <div class="form-row">
            <label></label>
            <div class="actions">
              <button id="submit-new-password" class="primary">提 交</button>
            </div>
          </div>
        </div>

        <!-- Step 4: Complete -->
        <div id="phone-step-4" class="complete hidden">
          <p class="success-message">新密码设置成功, 您可以使用新密码登录系统!</p>
        </div>
        
        <div class="form-row" style="text-align: center; margin-top: 20px;">
            <a href="#" class="link">手机号未通过核验？试试邮箱找回</a>
        </div>
      </section>

      <!-- 邮箱找回 -->
      <section id="tab-email" role="tabpanel" class="tab-content">
        <div class="form-grid">
          <div class="form-row">
            <label for="email">电子邮件</label>
            <div class="field">
              <input id="email" placeholder="注册时填写的电子邮箱" />
            </div>
          </div>
          <div class="form-row">
            <label for="emailIdType">证件类型</label>
            <div class="field">
              <select id="emailIdType">
                <option value="居民身份证" selected>居民身份证</option>
                <option value="中国护照">中国护照</option>
                <option value="外国护照">外国护照</option>
                <option value="港澳居民居住证">港澳居民居住证</option>
                <option value="台湾居民居住证">台湾居民居住证</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <label for="emailIdNumber">证件号码</label>
            <div class="field">
              <input id="emailIdNumber" placeholder="请输入证件号码" />
            </div>
          </div>
          <div class="form-row">
            <label></label>
            <div class="actions">
              <button id="sendEmail" class="primary">提 交</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="errorTip" class="error"></div>
    <div id="successTip" class="success"></div>
  </div>

  <script src="forgot_password.js"></script>
</body>
</html>
