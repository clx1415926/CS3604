<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>找回密码 - 12306</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-body">
  <div class="container">
    <div class="login-panel" style="margin-top: 40px;">
      <h1 class="card-title">找回密码</h1>

      <div id="maintenanceTip" class="hidden">当前处于维护窗口</div>

      <div class="tabs" role="tablist">
        <button id="tab-phone-btn" role="tab" aria-controls="tab-phone" class="tab active">手机找回</button>
        <button id="tab-email-btn" role="tab" aria-controls="tab-email" class="tab">邮箱找回</button>
        <button id="tab-face-btn" role="tab" aria-controls="tab-face" class="tab">人脸识别找回</button>
        </div>

      <!-- 手机找回 -->
      <section id="tab-phone" role="tabpanel" class="tab-content active">
        <ol id="phoneSteps" class="steps-indicator" aria-label="手机找回步骤">
          <li data-step="1" class="active">填写账户信息</li>
          <li data-step="2">获取验证码</li>
          <li data-step="3">设置新密码</li>
          <li data-step="4">完成</li>
        </ol>
        <div class="form-grid">
          <div id="phone-step-1">
            <div class="form-row">
              <label for="phone">手机号</label>
              <div class="field">
                <input id="phone" placeholder="例如：13812345678" />
                </div>
            </div>
            <div class="form-row">
              <label for="phoneIdType">证件类型</label>
              <div class="field">
                <select id="phoneIdType">
                  <option value="居民身份证" selected>居民身份证</option>
                  <option value="中国护照">中国护照</option>
                  <option value="外国护照">外国护照</option>
                  <option value="港澳居民居住证">港澳居民居住证</option>
                  <option value="台湾居民居住证">台湾居民居住证</option>
                </select>
                </div>
            </div>
            <div class="form-row">
              <label for="idNumber">身份证号</label>
              <div class="field">
                <input id="idNumber" placeholder="例如：110101199001011234" />
                </div>
            </div>
            <div class="actions">
              <button id="submitAccount" class="primary">提交账户信息</button>
              </div>
          </div>
          <div id="phone-step-2" class="hidden">
            <div class="form-row">
              <label for="smsCode">短信验证码</label>
              <div class="field sms-field">
                <input id="smsCode" placeholder="6位数字" />
                <button id="sendSms">获取验证码</button>
                <span id="smsCountdown" class="countdown">(05:00)</span>
                </div>
            </div>
            <div class="actions">
              <button id="verifySms" class="primary">验证并继续</button>
              </div>
              </div>
              </div>
              </section>

      <!-- 邮箱找回 -->
      <section id="tab-email" role="tabpanel" class="tab-content">
        <div class="form-grid">
          <div class="form-row">
            <label for="email">邮箱</label>
            <div class="field">
              <input id="email" placeholder="例如：user@example.com" />
              </div>
          </div>
          <div class="form-row">
            <label for="emailIdType">证件类型</label>
            <div class="field">
              <select id="emailIdType">
                <option value="居民身份证" selected>居民身份证</option>
                <option value="中国护照">中国护照</option>
                <option value="外国护照">外国护照</option>
                <option value="港澳居民居住证">港澳居民居住证</option>
                <option value="台湾居民居住证">台湾居民居住证</option>
              </select>
              </div>
          </div>
          <div class="form-row">
            <label for="emailIdNumber">证件号码</label>
            <div class="field">
              <input id="emailIdNumber" placeholder="请输入证件号码" />
              </div>
          </div>
          <div class="actions">
            <button id="sendEmail" class="primary">发送邮件</button>
            <span id="emailSentTip" class="status"></span>
            </div>
            </div>
            </section>

      <!-- 人脸识别找回 -->
      <section id="tab-face" role="tabpanel" class="tab-content">
        <div class="qr-area">
          <div class="qr-box">
            <img id="qrcode" alt="QR" />
          </div>
          <div id="qrStatus" class="qr-status">未扫码</div>
          <div class="qr-actions">
            <button id="face-mock-scan" class="secondary">模拟扫码</button>
            <button id="face-mock-confirm" class="secondary">模拟确认</button>
            <button id="face-mock-expire" class="secondary">模拟过期</button>
          </div>
          </div>
          </section>

      <!-- 新密码设置（共用） -->
      <section id="newPasswordForm" class="hidden">
        <div class="form-grid">
          <div class="form-row">
            <label for="newPassword">设置新密码</label>
            <div class="field">
              <input id="newPassword" type="password" placeholder="至少8位，包含大小写字母、数字与特殊字符" />
            </div>
          </div>
          <div class="form-row">
            <label></label>
            <div class="field">
              <div id="strengthMeter" class="strength">
                <div class="bar"></div>
                <span class="text"></span>
              </div>
            </div>
          </div>
          <div class="actions">
            <button id="submitNewPassword" class="primary">提交新密码</button>
            </div>
          <div id="errorTip" class="error"></div>
          <div id="successTip" class="status"></div>
          </div>
          </section>

      <div class="login-links">
        <a href="/login.html" class="link">返回登录</a>
      </div>
    </div>
  </div>

  <script src="/forgot_password.js"></script>
</body>
</html>
