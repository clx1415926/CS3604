<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>中国铁路12306 - 欢迎登录</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      // 在页面加载前声明后端 API 基址，支持通过 ?api_port=XXXX 覆盖端口
      (function(){
        try{
          var params = new URLSearchParams(location.search);
          var port = params.get('api_port') || '8082';
          window.API_BASE = 'http://127.0.0.1:' + port + '/api/v1';
        }catch(e){}
      })();
    </script>
  </head>
  <body class="login-body">
    <header class="site-header">
      <div class="container">
        <div class="brand">
          <span class="logo">◎</span>
          <span class="title">中国铁路12306</span>
        </div>
        <nav class="nav">
          <a id="nav-home" href="http://localhost:8080/">首页</a>
          <a href="/index.html">注册</a>
          <a href="/login.html" class="active">登录</a>
        </nav>
      </div>
    </header>

    <main class="login-hero">
      <div class="container login-layout">
        <!-- 左侧宣传与二维码下载 -->
        <section class="hero-left">
          <h1>铁路12306 - 中国铁路官方APP</h1>
          <h2>尽享精彩出行服务</h2>
          <ul class="hero-list" aria-label="应用特色">
            <li>个人行程提醒</li>
            <li>积分兑换</li>
            <li>餐饮·特产</li>
            <li>车站大屏</li>
          </ul>
          <div class="hero-qrcode">
            <img src="/img/登录与注册/official_app_qr.png" alt="扫码下载铁路12306 官方APP 二维码" />
            <div class="qrcode-desc">扫描二维码<br/>安装 铁路12306 官方APP</div>
          </div>
        </section>

        <!-- 右侧登录面板 -->
        <section class="login-panel" aria-labelledby="login-tabs">
          <div class="tabs" id="login-tabs" role="tablist">
            <button class="tab active" role="tab" aria-selected="true" aria-controls="tab-account" id="tab-account-btn">账户登录</button>
            <button class="tab" role="tab" aria-selected="false" aria-controls="tab-qr" id="tab-qr-btn">扫码登录</button>
          </div>

          <!-- 账户登录 -->
          <div id="tab-account" class="tab-content active" role="tabpanel" aria-labelledby="tab-account-btn">
            <form id="login-form" autocomplete="off">
              <div class="input-group">
                <span class="input-icon">👤</span>
                <input type="text" id="identifier" name="identifier" placeholder="用户名/邮箱/手机号" aria-label="用户名或邮箱或手机号" required />
              </div>

              <div class="input-group">
                <span class="input-icon">🔒</span>
                <input type="password" id="password" name="password" placeholder="密码" aria-label="密码" required />
              </div>

              <!-- 图形验证码与“记住我”功能已移除，保留简洁登录体验 -->

              <button type="submit" class="primary login-btn" id="login-btn">立即登录</button>
              <div class="login-links">
                <a href="/index.html" class="link">注册12306</a>
                <a href="#" id="forgot-password" class="link">忘记密码</a>
              </div>
              <div class="login-hint" id="login-hint">铁路12306服务时间：每日5:00-次日1:00；周二5:00-24:00</div>
              <div class="error" id="login-error" aria-live="polite"></div>
              <div class="status" id="login-status" aria-live="polite"></div>
            </form>
          </div>

          <!-- 扫码登录 -->
          <div id="tab-qr" class="tab-content" role="tabpanel" aria-labelledby="tab-qr-btn">
            <div class="qr-area">
              <div class="qr-box">
                <img id="qr-image" alt="登录二维码" />
              </div>
              <div class="qr-status" id="qr-status">二维码未生成</div>
              <div class="qr-actions">
                <button id="qr-generate" class="secondary">生成二维码</button>
                <button id="qr-refresh" class="secondary" disabled>刷新</button>
                <!-- 开发辅助：模拟扫描/确认 -->
                <button id="qr-mock-scan" class="link" disabled>模拟扫描</button>
                <button id="qr-mock-confirm" class="link" disabled>模拟确认</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 中部手机宣传图 -->
        <section class="hero-phone">
          <img src="login.png" alt="铁路12306手机应用展示" />
        </section>
      </div>
    </main>

    <!-- 登录二次验证（短信）弹窗 -->
    <div id="sms-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="sms-title" hidden>
      <div class="card dialog">
        <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
          <span id="sms-title">身份验证</span>
          <button id="sms-close" class="link" aria-label="关闭">×</button>
        </div>
        <div class="dialog-body" style="padding:16px;">
          <!-- Step 1: 身份证后4位校验 -->
          <div id="sms-step-id">
            <p class="hint">请输入登录账号绑定的证件号后4位</p>
            <div class="input-group">
              <span class="input-icon">🪪</span>
              <input type="text" id="id-last4" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="后4位" aria-label="身份证后4位" />
            </div>
            <div class="actions">
              <button id="id-verify" class="primary">验证</button>
            </div>
            <div id="sms-error" class="error" aria-live="polite"></div>
            <div id="sms-status" class="status" aria-live="polite"></div>
          </div>
          <!-- Step 2: 短信验证码输入 -->
          <div id="sms-step-code" hidden>
            <p class="hint">我们已向绑定手机号 <span id="sms-masked-phone">***********</span> 发送6位数字验证码</p>
            <div class="input-group">
              <span class="input-icon">💬</span>
              <input type="text" id="sms-code" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="请输入验证码" aria-label="短信验证码" />
            </div>
            <div class="actions" style="gap:12px;">
              <button id="sms-verify" class="primary">确认登录</button>
              <button id="sms-resend" class="secondary" disabled>重新发送</button>
              <span class="countdown" id="sms-countdown" aria-live="polite">剩余 05:00</span>
            </div>
            <div id="sms-error-2" class="error" aria-live="polite"></div>
            <div id="sms-status-2" class="status" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container footer-links">
        <div class="partners">
          <span>友情链接：</span>
          <a href="#">中国铁路微信公众号</a>
          <a href="#">12306 公益公众号</a>
          <a href="#">铁路12306</a>
        </div>
        <p class="copyright">© 中国铁路客户服务中心</p>
      </div>
    </footer>

    <script src="login.js"></script>
    <script>
      (function(){
        try{
          var HOME_URL = (window && window.HOME_URL) || 'http://localhost:8080/';
          var a = document.getElementById('nav-home');
          if(a) a.setAttribute('href', HOME_URL);
        }catch(e){}
      })();
    </script>
  </body>
  </html>
