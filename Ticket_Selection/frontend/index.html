    <!-- 头部登录状态处理脚本 -->
    <script>
      (function(){
        try {
          var params = new URLSearchParams(window.location.search || '');
          var sid = params.get('sid');
          if (sid) {
            try { localStorage.setItem('SESSION_ID', sid); } catch(e) {}
            try { params.delete('sid'); } catch(e) {}
            var q = params.toString() ? ('?' + params.toString()) : '';
            var cleanUrl = window.location.origin + window.location.pathname + q + (window.location.hash || '');
            window.history.replaceState({}, document.title, cleanUrl);
          }
          var storedSid = sid || (function(){ try { return localStorage.getItem('SESSION_ID'); } catch(e) { return null; } })();
          if (storedSid) {
            fetch('http://localhost:8082/api/v1/auth/session/profile', { headers: { Authorization: 'Bearer ' + storedSid } })
              .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
              .then(function(res){
                if (res.ok && res.data && (res.data.username || res.data.name)) {
                  var welcomeEl = document.getElementById('welcome-user');
                  var loginEl = document.getElementById('J-header-login');
                  var logoutEl = document.getElementById('J-header-logout');
                  if (welcomeEl) {
                    welcomeEl.textContent = (res.data.username || '') + (res.data.name ? '（' + res.data.name + '）' : '');
                  }
                  if (loginEl) loginEl.style.display = 'none';
                  if (logoutEl) logoutEl.style.display = '';
                }
              })
              .catch(function(){});
          }
          
          // 退出登录
          var regist_out = document.getElementById('regist_out');
          if (regist_out) {
            regist_out.addEventListener('click', function(e){
              e.preventDefault();
              try { localStorage.removeItem('SESSION_ID'); } catch(err) {}
              var loginEl = document.getElementById('J-header-login');
              var logoutEl = document.getElementById('J-header-logout');
              if (loginEl) loginEl.style.display = '';
              if (logoutEl) logoutEl.style.display = 'none';
            });
          }
          
          // 清除伪元素背景
          var headerEl = document.querySelector('.header');
          if (headerEl) {
            var beforeStyle = window.getComputedStyle(headerEl, '::before');
            var beforeContent = beforeStyle && beforeStyle.getPropertyValue('content');
            if (beforeContent && beforeContent !== 'none' && beforeContent !== 'normal' && beforeContent !== '""') {
              var st = document.createElement('style');
              st.textContent = '.header::before{content:none !important;display:none !important;background:transparent !important;}';
              document.head.appendChild(st);
            }
          }
        } catch (e) {}
      })();
    </script>
