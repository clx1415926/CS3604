- id: REQ-1
  name: 首页与导航 (Home Page)
  functional_description: 系统入口页面，提供核心功能导航、服务时间展示及快捷查询入口。
  ui_description: |
    页面整体风格参考铁路12306官网首页，采用自上而下的三段式布局。
    顶部为品牌区与简要导航，展示站点名称、品牌标识和欢迎语。
    主视觉区域展示服务时间说明（购票服务每日5:00-次日1:00，周二为5:00-24:00）、官方安全提示以及可选的官方APP下载提示与二维码位。
    功能区集中展示5个入口按钮："登录注册"、"车票查询"、"订单管理"、"乘客管理"、"个人信息"，其中登录注册和车票查询为主按钮样式，其余为次按钮。
    底部为页脚，包含友情链接、版权与备案信息以及"适老化无障碍服务"说明或入口。
    页面支持基本响应式布局，在移动端将内容纵向堆叠显示，并保证按钮触控区域和文字可读性；整体支持键盘导航与可访问名称，适配屏幕阅读器。
  scenarios:
    - name: 首页展示基本信息与服务时间
      steps:
        - action: 访问系统首页并完成首屏渲染
          expectation: 显示品牌标识与欢迎语、服务时间说明以及关于官方APP与授权的安全提示。
    - name: 展示五个功能入口按钮
      steps:
        - action: 打开首页
          expectation: 首屏区域显示"登录注册"、"车票查询"、"订单管理"、"乘客管理"、"个人信息"五个按钮，按钮具有清晰的可访问名称与聚焦样式。
    - name: 响应式布局与移动端适配
      steps:
        - action: 在手机宽度（≤768px）下访问首页
          expectation: 主要内容改为纵向排列，按钮堆叠显示且触控高度不小于推荐尺寸，文本不溢出并可滚动查看。
    - name: 页脚与合规信息展示
      steps:
        - action: 页面渲染完成后滚动至底部
          expectation: 显示友情链接列表、版权与备案信息以及"适老化无障碍服务"入口或说明。
  children:
    - id: REQ-1-1
      name: 全局导航
      functional_description: 提供登录注册、车票查询、订单管理、乘客管理、个人信息等功能入口，并根据登录态控制访问与拦截提示。
      ui_description: |
        首页中部功能区显示5个主要功能按钮："登录注册"、"车票查询"、"订单管理"、"乘客管理"、"个人信息"。
        未登录时点击"订单管理"、"乘客管理"、"个人信息"会先进行登录态检查，若未登录则弹出或显示登录提示并引导至登录/注册页面；已登录时直接跳转到对应业务页面。
        "登录注册"按钮在用户登录后可替换为用户信息入口或退出入口，以提示当前登录状态。
        所有按钮支持键盘操作，Tab 键按逻辑顺序依次聚焦，Enter/Space 触发点击；按钮具有明确的聚焦样式和可访问名称。
      scenarios:
        - name: 跳转至登录注册页面
          steps:
            - action: 在首页点击"登录注册"按钮
              expectation: 跳转至登录/注册页面，对应路由与页面标题显示正确。
        - name: 未登录跳转车票查询
          steps:
            - action: 在未登录状态下点击"车票查询"按钮
              expectation: 直接跳转至车票查询页面并正常展示查询表单。
        - name: 未登录跳转订单管理被拦截
          steps:
            - action: 在未登录状态下点击"订单管理"按钮
              expectation: 显示需先登录的提示或弹窗，并引导用户前往登录/注册页面，不进入订单管理实际页面。
        - name: 未登录跳转乘客管理被拦截
          steps:
            - action: 在未登录状态下点击"乘客管理"按钮
              expectation: 显示登录提示并引导至登录/注册页面，不进入乘客管理实际页面。
        - name: 未登录跳转个人信息被拦截
          steps:
            - action: 在未登录状态下点击"个人信息"按钮
              expectation: 显示登录提示并引导至登录/注册页面，不进入个人信息实际页面。
        - name: 登录后跳转订单管理成功
          steps:
            - action: 在已登录状态下点击"订单管理"按钮
              expectation: 成功跳转至订单管理页面并显示订单列表。
        - name: 登录后跳转乘客管理成功
          steps:
            - action: 在已登录状态下点击"乘客管理"按钮
              expectation: 成功跳转至乘客管理页面并显示乘客列表。
        - name: 登录后跳转个人信息成功
          steps:
            - action: 在已登录状态下点击"个人信息"按钮
              expectation: 成功跳转至个人信息页面并展示用户资料信息。
        - name: 导航失败的错误提示
          steps:
            - action: 用户在首页点击任一导航按钮时路由解析失败或网络错误
              expectation: 页面显示错误提示并提供"重试"和"返回首页"操作，同时记录不含敏感信息的错误日志。
        - name: 无障碍键盘导航
          steps:
            - action: 使用键盘Tab键在首页功能按钮间移动焦点
              expectation: 焦点顺序依次为"登录注册"→"车票查询"→"订单管理"→"乘客管理"→"个人信息"，且每个按钮可通过Enter或Space触发点击。

- id: REQ-2
  name: 登录与注册 (Login & Register)
  functional_description: 用户身份认证与账户创建功能，保障系统安全与实名制要求。
  children:
    - id: REQ-2-1
      name: 用户登录
      functional_description: 支持账号密码、手机号、邮箱及扫码登录多种方式。
      ui_description: |
        登录面板居中，提供"账号登录"与"扫码登录"两个选项卡。
        账号登录区域包含统一的账号输入框（支持用户名/手机/邮箱）、密码输入框、图形验证码区域（在触发安全策略或可疑登录时显示）。
        底部提供"记住登录状态"复选框、"忘记密码"链接和"立即登录"主按钮，错误提示在对应输入框下方以红色文字展示。
        扫码登录区域展示大号二维码，提示有效期约2分钟，二维码过期后提供"刷新二维码"按钮。
      scenarios:
        - name: 用户名/手机号/邮箱登录成功
          steps:
            - action: 在"账号登录"输入框输入已注册的用户名/手机号/邮箱
            - action: 输入正确的登录密码并点击"立即登录"
            - expectation: 系统验证账号和密码，通过后跳转到个人中心或来源页，并提示登录成功。
        - name: 账号或密码错误登录失败
          steps:
            - action: 输入存在的用户名但密码错误
            - action: 点击"立即登录"按钮
            - expectation: 登录失败，页面停留在登录页，并在密码下方显示"用户名或密码错误"等提示，密码框被清空。
        - name: 空用户名或密码校验
          steps:
            - action: 保持用户名输入框为空，仅输入密码后点击"立即登录"
            - action: 仅输入用户名，保持密码为空后点击"立即登录"
            - expectation: 页面分别在对应输入框下方提示"请输入用户名"或"请输入密码"，不发起登录请求。
        - name: 图形验证码校验
          steps:
            - action: 连续多次登录失败或系统判定为可疑登录
            - action: 登录页面展示图形验证码输入框
            - action: 用户输入错误验证码并点击登录
            - expectation: 系统提示"验证码错误"并刷新验证码，用户名和密码保持原样，用户停留在登录页。
        - name: 连续失败导致账户锁定
          steps:
            - action: 用户连续多次输入错误密码尝试登录
            - action: 再次点击"立即登录"按钮
            - expectation: 系统锁定账户，在页面顶部或密码下方提示"账户已被锁定，请稍后重试或联系客服"，登录按钮暂时不可用。
        - name: 扫码登录成功
          steps:
            - action: 在登录页切换到"扫码登录"选项卡
            - action: 使用已登录的12306官方APP扫描网页二维码并在APP内确认
            - expectation: 网页自动完成登录并跳转到个人中心，提示登录成功。
        - name: 扫码二维码过期
          steps:
            - action: 在扫码登录页面停留超过二维码有效期后再尝试扫码
            - expectation: 页面提示"二维码已过期，请刷新重试"，并提供"刷新二维码"按钮以生成新的二维码。
        - name: 记住登录状态与过期
          steps:
            - action: 勾选"记住登录状态"后成功登录并关闭浏览器
            - action: 在有效期内重新访问网站
            - expectation: 用户保持登录状态可直接访问个人中心；超出会话过期时系统提示"登录已过期，请重新登录"并跳转登录页。
    - id: REQ-2-2
      name: 用户注册
      functional_description: 新用户账户创建，包含基本信息填写、实名验证与手机核验。
      ui_description: |
        单列分步注册表单：账户信息 -> 个人与证件信息 -> 联系方式与手机核验 -> 条款确认 -> 注册完成。
        表单采用标签右对齐布局，必填字段使用红色"*"标识，支持用户名、密码、姓名、证件类型/号码、手机号、邮箱等字段。
        每个字段在失去焦点时进行格式与唯一性校验，正确时以绿色边框和勾选图标显示，错误时以红色边框和错误文案提示。
        手机验证码区域与"获取验证码"按钮组合展示，按钮在发送后进入倒计时状态；底部提供服务条款与隐私政策勾选框及"下一步"主按钮。
      scenarios:
        - name: 完整注册流程
          steps:
            - action: 填写用户名、密码、证件信息
            - action: 进行手机短信验证
            - action: 提交注册
            - expectation: 所有校验通过后系统保存用户信息，完成注册并提示成功，跳转登录页或自动登录。
        - name: 用户名格式与唯一性校验
          steps:
            - action: 在用户名输入框输入不符合规则的值（如数字开头或长度小于6位）
            - action: 或输入已被占用的用户名并离开输入框
            - expectation: 系统在字段下方显示格式或占用错误提示，并禁止进入下一步。
        - name: 密码强度与确认校验
          steps:
            - action: 输入仅包含单一类型字符的弱密码或两次密码输入不一致
            - expectation: 密码强度指示器显示"弱"并给出改进建议，确认密码字段提示"确认密码与密码不同"，不可提交。
        - name: 身份信息验证
          steps:
            - action: 选择证件类型并输入姓名和证件号码
            - action: 提交进行实名认证
            - expectation: 格式正确且与权威库匹配时提示"身份信息验证通过"；若姓名与证件不匹配则给出明确错误提示和人工客服联系方式。
        - name: 手机号验证码验证
          steps:
            - action: 输入合法手机号后点击"获取验证码"
            - action: 在验证码有效期内输入收到的验证码
            - expectation: 系统发送6位验证码并提示已发送，验证码正确且未过期时提示"手机验证成功"，否则提示"验证码错误"或"验证码已过期"并允许重新获取。
        - name: 手机号或证件重复注册检查
          steps:
            - action: 使用已被注册的手机号或证件号码尝试注册
            - expectation: 系统提示该手机号或证件已注册，并引导用户使用原账号登录或通过App/车站窗口处理被抢注情况。
        - name: 服务条款确认与表单提交
          steps:
            - action: 在未勾选服务条款复选框的情况下点击"下一步"
            - expectation: 系统阻止提交并提示需先同意服务条款；勾选后按钮变为可用，提交成功后跳转到手机验证或注册完成页面。
        - name: 必填信息缺失与异常处理
          steps:
            - action: 留空部分必填字段或在网络异常/服务器错误情况下提交表单
            - expectation: 系统高亮所有缺失字段并滚动到第一个错误位置；网络或服务器异常时给出友好提示并保留已填写信息，允许用户重试。
    - id: REQ-2-3
      name: 密码找回
      functional_description: 忘记密码时通过手机、邮箱或人脸识别重置密码。
      ui_description: |
        登录页面提供"忘记密码"入口，点击后进入密码找回页面，采用选项卡式布局，包含"手机找回"、"邮箱找回"和"人脸找回"三个标签。
        不同标签下展示对应表单：手机找回包含手机号、证件类型与证件号码输入框及短信验证码区域；邮箱找回包含邮箱、证件类型与证件号码输入框；人脸找回展示用于在12306App中发起人脸验证的二维码。
        重置密码表单包含新密码与确认密码输入框及密码强度指示器，提交后统一返回登录页面并提示重置成功。
      scenarios:
        - name: 手机号找回密码成功
          steps:
            - action: 在密码找回页面选择"手机找回"，输入注册手机号、证件类型和证件号码
            - action: 点击"获取验证码"并在有效期内输入正确验证码及新密码
            - expectation: 系统校验信息与验证码无误后更新密码，提示"密码重置成功"并跳转登录页。
        - name: 手机号验证码超时或不匹配
          steps:
            - action: 已请求验证码但在超出有效期后输入验证码，或手机号与注册信息不匹配
            - expectation: 系统提示"验证码已过期，请重新获取"或"手机号码与注册信息不匹配"，不更新密码并允许重新获取验证码或修改信息。
        - name: 邮箱找回密码
          steps:
            - action: 选择"邮箱找回"，输入注册邮箱、证件类型和证件号码并提交
            - expectation: 系统验证通过后发送包含重置链接的邮件，点击仍在有效期内的链接可进入重置密码页面设置新密码；过期链接则提示"重置链接已过期"并提供重新申请入口。
        - name: 人脸识别找回密码
          steps:
            - action: 选择"人脸找回"并根据页面指引在12306App中扫描二维码发起人脸识别
            - expectation: 识别通过后系统允许设置新密码并重置成功；连续多次识别失败时暂时锁定该方式并提示尝试手机或邮箱找回。
        - name: 网络异常或系统维护期间访问
          steps:
            - action: 在进行密码找回时网络中断或系统处于维护时间段
            - expectation: 页面顶部显示"网络连接异常"或"系统维护中，请在服务时间内使用"的提示，保留已填写信息并提供重试或联系客服的引导。

- id: REQ-3
  name: 车票查询 (Ticket Selection)
  functional_description: 提供车次信息的查询、筛选与展示功能。
  ui_description: |
    页面整体结构参考12306官网左侧余票查询页面。
    顶部为查询条件输入区，包含出发地、目的地输入框（支持中文站名/拼音/首字母自动完成）、出发日期选择器与查询按钮，可选往返、学生票等开关。
    查询条件下方为日期快捷切换栏，以标签形式展示连续日期，当前选中日期高亮，点击任一日期自动刷新车次列表。
    日期栏下方为高级筛选区，提供车次类型（高铁/动车/直达等）、席别（一等座/二等座/软卧/硬卧等）、出发站/到达站筛选，以及可选的优惠、积分兑换、仅显示可预订等开关。
    主体区域为车次结果列表，以表格或卡片形式展示车次号、出发/到达站与时间、历时以及各席别余票状态（有/无/数字/--），每行提供"预订"按钮，无票时可显示"候补"或禁用状态。
    列表支持按出发时间、历时、到达时间等维度排序，并在筛选时实时刷新结果，适配桌面与移动端浏览。
  children:
    - id: REQ-3-1
      name: 查询条件设置
      functional_description: 支持站名输入自动补全、站点互换、日期选择及查询按钮触发，部分实现单程/往返与票种切换。
      scenarios:
        - name: 站名自动补全
          steps:
            - action: 输入"bj"
            - action: 选择"北京"
            expectation: 输入框填充"北京"。
        - name: 站点互换
          steps:
            - action: 点击交换按钮
            expectation: 出发地与目的地互换。
        - name: 设置出发日期并查询
          steps:
            - action: 在出发日期选择器中选择某一日期
            - action: 点击"查询"按钮
            expectation: 跳转或刷新车次列表页面，展示所选日期的车次信息。
        - name: 日期快捷切换
          steps:
            - action: 在车次列表页点击日期快捷栏中的相邻日期标签
            expectation: 高亮选中日期并自动刷新车次列表为对应日期的结果。
        - name: 修改查询条件重新查询
          steps:
            - action: 在车次列表页面修改出发地、目的地或日期
            - action: 再次点击"查询"按钮
            expectation: 根据最新条件重新查询并更新车次列表。
    - id: REQ-3-2
      name: 结果列表与筛选
      functional_description: 展示车次详情（车次号、时间、历时、余票），支持多维度筛选与排序。
      ui_description: |
        列表每行展示车次号、出发站/到达站、出发时间/到达时间、历时及各席别余票状态，各席别单元格显示"有"、具体数字、"无"或"--"。
        列表头部提供按出发时间、历时、到达时间排序的交互入口，当前排序方式高亮。
        顶部或侧边展示车次类型与席别筛选复选框，以及出发站/到达站下拉筛选，勾选或选择后列表即时刷新。
        有余票的车次显示高亮"预订"按钮，无余票时按钮置灰或替换为"候补"按钮（如支持候补），点击预订进入订单填写流程。
      scenarios:
        - name: 筛选高铁动车
          steps:
            - action: 勾选"高铁/城际"和"动车"
            expectation: 列表仅显示G/C/D字头列车。
        - name: 按耗时排序
          steps:
            - action: 点击"历时"表头
            expectation: 列表按历时升序/降序重新排列。
        - name: 按席别有票筛选
          steps:
            - action: 勾选"一等座"或"二等座"等席别筛选项
            expectation: 列表仅显示对应席别存在余票的车次，多选时为"或"逻辑。
        - name: 按出发/到达站筛选
          steps:
            - action: 在"出发车站"下拉中选择具体车站
            - action: 或在"到达车站"下拉中选择具体车站
            expectation: 列表仅显示从所选出发站发车或到所选到达站到达的车次。
        - name: 预订入口与无余票提示
          steps:
            - action: 在有余票车次行点击"预订"按钮
            expectation: 跳转至订单填写页面并显示所选车次详情；对于无余票席别，单元格显示"无"或"--"，预订按钮禁用或变为"候补"。
        - name: 未登录预订拦截
          steps:
            - action: 在未登录状态下点击某车次的"预订"按钮
            expectation: 跳转至登录页面或弹出登录提示，登录后可继续原预订操作。

- id: REQ-4
  name: 订单管理 (Ticket Management)
  functional_description: 涵盖车票预订、乘车人选择、座位选座及订单支付/取消全流程。
  children:
    - id: REQ-4-1
      name: 车票预订与填写
      functional_description: 选中车次后填写乘客信息、选择席别与座位。
      ui_description: |
        订单填写页顶部展示车次关键信息，包括车次号、出发/到达站、出发/到达时间、出发日期等。
        页面主体左侧为常用联系人列表，以卡片形式展示乘客姓名、证件类型与脱敏证件号，可通过复选框选择一个或多个乘车人。
        选中乘车人后可进入席别与选座流程，展示可视化座位图，座位按钮按A-F列区分并高亮当前选择，靠窗座位有窗口图标标识。
        页面右侧为订单汇总区，实时展示所选车次、乘客名单、席别与座位号、票种与总价等信息。
        页面底部提供"提交订单"或"确认"按钮，提交过程中展示"正在处理，请稍候..."的加载提示，防止重复提交。
      scenarios:
        - name: 成功预订车票
          steps:
            - action: 从车票查询结果中点击某车次"预订"按钮进入订单填写页
            - action: 确认页面顶部车次信息与预期一致
            - action: 在常用联系人列表中勾选至少一名乘车人
            - action: 根据提示完成席别选择与可视化选座
            - action: 点击"提交订单"或"确认"按钮
            - expectation: 系统锁定对应席位并生成待支付订单，展示成功提示并提供跳转至未完成订单或支付页面的入口。
        - name: 单人与多人订票
          steps:
            - action: 在订单填写页面勾选单个联系人
            - expectation: 订单汇总区展示一位乘车人信息，票价为单人票价。
            - action: 再额外勾选其他联系人
            - expectation: 汇总区展示多名乘车人，票价合计为多人总价。
        - name: 可视化选座
          steps:
            - action: 在选座界面选择某席别标签（如"二等座"）
            - action: 在座位图中点击一个可用座位
            - expectation: 被选座位高亮显示，座位号同步展示在订单汇总区，确认后返回订单页保留选座结果。
        - name: 无余票或按钮禁用边界情况
          steps:
            - action: 在车票查询页面选中无余票或仅候补的车次
            - expectation: 对应席别单元格不支持选座，"预订"按钮置灰或显示"候补"，无法进入正常订单填写流程。
        - name: 未登录访问订单填写
          steps:
            - action: 在未登录状态下点击车次"预订"按钮
            - expectation: 系统跳转至登录页面或弹出登录提示，登录成功后返回订单填写页并保留原查询条件。
    - id: REQ-4-2
      name: 订单查看与取消
      functional_description: 查看未完成/未出行/历史订单详情，支持取消未支付订单或继续支付。
      ui_description: |
        订单管理页左侧为订单中心菜单，可在火车票订单、候补订单等类型间切换；右侧内容区顶部为"未完成订单"、"未出行订单"、"历史订单"标签页。
        未完成订单列表以卡片形式展示每一笔订单，包含订票日期、车次信息、乘客信息、席别与座位号、票种与价格、订单状态等。
        每个订单卡片底部提供"取消订单"和"去支付"按钮，右侧区域展示支付时限、取消规则等温馨提示信息。
        取消订单时弹出确认对话框，提示取消次数限制和后果，确认后展示取消成功对话框并可返回车票查询页或刷新订单列表。
      scenarios:
        - name: 查看未完成订单列表
          steps:
            - action: 在已登录状态下通过导航进入订单管理页
            - expectation: 默认选中"未完成订单"标签，列表展示所有待支付订单的关键信息及操作按钮。
        - name: 取消未支付订单
          steps:
            - action: 在未完成订单列表中点击某订单的"取消订单"按钮
            - action: 在弹出的确认对话框中阅读取消规则并点击"确定"
            - expectation: 系统提交取消请求，订单状态更新为已取消并释放席位，弹出"取消订单成功"提示，用户可返回车票查询页或继续浏览订单列表。
        - name: 取消操作放弃
          steps:
            - action: 点击"取消订单"按钮
            - action: 在确认对话框中点击"取消"或关闭对话框
            - expectation: 对话框关闭且订单保持原状态不变。
        - name: 继续支付订单
          steps:
            - action: 在未完成订单列表中点击"去支付"按钮
            - expectation: 跳转至支付页面或模拟支付入口，保留当前订单信息以完成支付流程。
        - name: 未登录访问订单管理拦截
          steps:
            - action: 在未登录状态下通过导航尝试进入订单管理页
            - expectation: 系统提示需先登录并跳转至登录页面，登录后再访问订单管理可正常加载订单列表。

- id: REQ-5
  name: 个人信息管理 (User Center)
  functional_description: 用户基本信息查看、联系方式修改及优惠类型管理。
  ui_description: |
    页面通过左侧菜单导航和右侧信息展示区实现个人信息查看与编辑。
    右侧区域划分为"基本信息"、"联系方式"和"附加信息"三个信息卡片，初始为只读模式，展示用户名、姓名、证件信息、手机号、邮箱和优惠(待)类型等。
    基本信息区字段均为只读；联系方式和附加信息区标题右侧提供"编辑"链接，点击后进入编辑模式，按钮文案变为"保存"并展示跳转修改手机号/邮箱的链接或可编辑控件。
  children:
    - id: REQ-5-1
      name: 信息查看
      functional_description: 展示脱敏后的姓名、证件号、手机号及核验状态，区分基本信息、联系方式和附加信息区域。
      ui_description: |
        基本信息区按行展示用户名、姓名、国家/地区、证件类型、脱敏证件号码和核验状态，所有字段只读。
        联系方式区展示脱敏手机号与邮箱，并分别标明手机号核验状态与邮箱激活状态。
        附加信息区展示当前优惠(待)类型（成人/儿童/学生/残疾军人之一），支持后续进入编辑模式修改。
      scenarios:
        - name: 查看个人基本信息
          steps:
            - action: 在已登录状态下进入"个人中心 > 个人信息 > 查看个人信息"
            - expectation: 页面展示基本信息区，包含用户名、姓名、国家/地区、证件类型、脱敏证件号及核验状态，所有字段不可编辑。
        - name: 查看联系方式与附加信息
          steps:
            - action: 在个人信息页查看联系方式和附加信息区域
            - expectation: 联系方式区显示脱敏手机号及"已通过核验"等状态、脱敏邮箱及"已激活"状态；附加信息区显示当前优惠(待)类型及"编辑"按钮。
    - id: REQ-5-2
      name: 信息修改
      functional_description: 修改手机号（需核验）、邮箱及旅客优惠类型（成人/儿童/学生/残疾军人），通过进入编辑模式或跳转专门页面完成。
      ui_description: |
        联系方式区点击"编辑"后进入编辑模式，标题右侧按钮变为"保存"，手机号与邮箱仍以脱敏形式展示，下方出现"去手机核验修改"与"去安全邮箱修改"链接，点击分别跳转到对应修改页面。
        附加信息区点击"编辑"后进入编辑模式，优惠(待)类型字段变为下拉选择框，包含成人、儿童、学生、残疾军人四个选项，保存后恢复为只读展示。
        手机核验页面展示原脱敏手机号和核验状态，提供国家代码选择、新手机号输入框和登录密码输入框，下方提供"取消"与"确认"按钮。
      scenarios:
        - name: 联系方式编辑模式切换
          steps:
            - action: 在个人信息页点击联系方式区"编辑"按钮
            - expectation: 联系方式区进入编辑模式，按钮文案变为"保存"，出现"去手机核验修改"与"去安全邮箱修改"链接。
            - action: 再次点击"保存"按钮
            - expectation: 退出编辑模式，链接隐藏，按钮文案恢复为"编辑"。
        - name: 跳转手机核验修改手机号
          steps:
            - action: 在联系方式编辑模式下点击"去手机核验修改"链接
            - expectation: 页面跳转至手机核验页面，展示原手机号（脱敏）、国家代码选择、新手机号与登录密码输入框，以及"确认"/"取消"按钮。
        - name: 修改优惠类型
          steps:
            - action: 在附加信息区点击"编辑"按钮进入编辑模式
            - action: 在优惠(待)类型下拉中选择新的类型（如"学生"）
            - action: 点击"保存"按钮
            - expectation: 提交成功后附加信息区恢复查看模式并显示新的优惠类型。
        - name: 修改手机号正常流程
          steps:
            - action: 在手机核验页面输入格式正确且未被占用的新手机号和正确的登录密码
            - action: 点击"确认"按钮
            - expectation: 系统验证通过后更新手机号并返回个人信息页，联系方式区显示新的脱敏手机号。
        - name: 修改手机号取消与错误处理
          steps:
            - action: 在手机核验页面填写部分信息后点击"取消"按钮
            - expectation: 返回个人信息页且手机号未被修改。
            - action: 再次进入手机核验页面，输入错误密码或格式错误的手机号后点击"确认"
            - expectation: 页面在相应字段下方提示"密码错误"或"手机号格式错误，请检查"，停留在当前页并保留已输入的新手机号以便修正。
