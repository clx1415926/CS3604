# 12306铁路系统前端UI接口库
# 版本: v1.0
# 创建日期: 2025-01-18

# 用户认证相关UI组件
- type: Frontend
  id: UI-RegisterForm
  description: 用户注册表单组件，处理用户注册流程包括信息填写和验证码验证。
  properties:
    - name: onRegisterSuccess
      type: function
      description: "注册成功后的回调函数。"
    - name: onRegisterError
      type: function
      description: "注册失败时的错误处理回调。"
    - name: initialValues
      type: object
      description: "表单初始值，用于编辑模式。"
  state:
    - phoneNumber
    - email
    - verificationCode
    - password
    - confirmPassword
    - realName
    - idCard
    - isLoading
    - errors
    - codeCountdown
  dependencies:
    - API-POST-Register
    - API-POST-SendVerificationCode
  acceptanceCriteria:
    - 组件应渲染手机号、邮箱、验证码、密码、确认密码、真实姓名、身份证号输入框。
    - 点击获取验证码按钮时，应调用发送验证码API并启动60秒倒计时。
    - 点击注册按钮时，应验证所有必填字段并调用注册API。
    - 当isLoading状态为true时，注册按钮应被禁用并显示加载状态。
    - 实时验证输入格式，如手机号、邮箱、身份证号格式。
    - 密码强度检查和确认密码一致性验证。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

# 首页相关UI组件接口
- type: Frontend
  id: UI-HomeHeader
  description: 首页顶部导航栏，包含用户状态显示和辅助功能。
  properties:
    - name: userInfo
      type: object
      description: "用户信息对象，包含登录状态和基本信息。"
    - name: onLoginClick
      type: function
      description: "点击登录按钮的回调函数。"
    - name: onRegisterClick
      type: function
      description: "点击注册按钮的回调函数。"
    - name: onUserMenuClick
      type: function
      description: "点击用户菜单的回调函数。"
  state:
    - isLoggedIn
    - userMenuVisible
    - notificationCount
  dependencies:
    - API-GET-UserStatus
  acceptanceCriteria:
    - 未登录时显示登录/注册按钮。
    - 已登录时显示用户头像、昵称和下拉菜单。
    - 包含消息通知、帮助中心等辅助功能入口。
    - 支持响应式布局，移动端自适应。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持首页顶部导航功能。"

- type: Frontend
  id: UI-TicketQueryForm
  description: 车票查询表单，包含出发地/目的地选择、日期选择和查询选项。
  properties:
    - name: onSearch
      type: function
      description: "提交查询的回调函数。"
    - name: defaultValues
      type: object
      description: "表单默认值，包含出发地、目的地、日期等。"
    - name: disabled
      type: boolean
      description: "是否禁用表单，默认false。"
  state:
    - fromStation
    - toStation
    - departDate
    - returnDate
    - passengerType
    - trainType
    - onlyAvailable
    - includeNoSeat
    - isLoading
    - errors
    - showDatePicker
    - showStationSelector
  dependencies:
    - API-GET-StationsSearch
    - API-GET-HotCities
    - API-GET-UserRecentStations
    - API-POST-SaveSearchHistory
  acceptanceCriteria:
    - 出发地/目的地输入框支持自动补全和热门城市选择。
    - 日期选择器支持快速选择和日历视图。
    - 包含乘客类型、车次类型等查询选项。
    - 表单验证：出发地和目的地不能相同，日期不能早于当前日期。
    - 支持交换出发地和目的地功能。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持首页车票查询功能。"

- type: Frontend
  id: UI-StationSelector
  description: 车站选择器组件，支持搜索、热门城市和历史记录。
  properties:
    - name: value
      type: string
      description: "当前选中的车站。"
    - name: onChange
      type: function
      description: "车站选择变化的回调函数。"
    - name: placeholder
      type: string
      description: "输入框占位符文本。"
    - name: showHistory
      type: boolean
      description: "是否显示历史记录，默认true。"
  state:
    - searchKeyword
    - suggestions
    - hotCities
    - recentStations
    - isLoading
    - showDropdown
  dependencies:
    - API-GET-StationsSearch
    - API-GET-HotCities
    - API-GET-UserRecentStations
  acceptanceCriteria:
    - 输入1个字符后开始搜索并显示建议。
    - 显示热门城市分组（按省份）。
    - 已登录用户显示最近使用的车站。
    - 支持键盘导航和点击选择。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持车站选择功能。"

- type: Frontend
  id: UI-DatePicker
  description: 日期选择器组件，支持快速选择和日历视图。
  properties:
    - name: value
      type: string
      description: "当前选中的日期。"
    - name: onChange
      type: function
      description: "日期变化的回调函数。"
    - name: minDate
      type: string
      description: "最小可选日期，默认为今天。"
    - name: maxDate
      type: string
      description: "最大可选日期，默认为60天后。"
    - name: showQuickSelect
      type: boolean
      description: "是否显示快速选择，默认true。"
  state:
    - selectedDate
    - currentMonth
    - showCalendar
    - quickSelectOptions
  dependencies:
    - API-GET-SystemConfig
  acceptanceCriteria:
    - 提供今天、明天、后天等快速选择选项。
    - 日历视图标识节假日和票源紧张日期。
    - 禁用过去的日期和超出预售期的日期。
    - 支持键盘输入和点击选择。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持日期选择功能。"

- type: Frontend
  id: UI-QuickAccess
  description: 快捷入口组件，包含个人中心和常用功能。
  properties:
    - name: userInfo
      type: object
      description: "用户信息对象。"
    - name: onItemClick
      type: function
      description: "点击快捷入口项的回调函数。"
  state:
    - isLoggedIn
    - quickItems
  dependencies:
    - API-GET-UserStatus
  acceptanceCriteria:
    - 未登录时显示登录提示和基础功能入口。
    - 已登录时显示个人中心相关功能。
    - 包含我的订单、常用联系人、个人信息等入口。
    - 支持图标和文字显示。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持首页快捷入口功能。"

- type: Frontend
  id: UI-HotRoutes
  description: 热门线路推荐组件，显示热门出行路线。
  properties:
    - name: onRouteClick
      type: function
      description: "点击热门线路的回调函数。"
    - name: limit
      type: number
      description: "显示的线路数量，默认12。"
  state:
    - routes
    - isLoading
    - updateTime
  dependencies:
    - API-GET-HotRoutes
  acceptanceCriteria:
    - 显示热门出发地到目的地的线路。
    - 包含参考价格和车次数量信息。
    - 点击线路自动填充查询表单。
    - 支持响应式布局，移动端滑动查看。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持热门线路推荐功能。"

- type: Frontend
  id: UI-SearchHistory
  description: 搜索历史组件，显示用户最近的查询记录。
  properties:
    - name: onHistoryClick
      type: function
      description: "点击历史记录的回调函数。"
    - name: onClearHistory
      type: function
      description: "清空历史记录的回调函数。"
    - name: visible
      type: boolean
      description: "是否显示历史记录，默认true。"
  state:
    - history
    - isLoading
  dependencies:
    - API-GET-UserSearchHistory
  acceptanceCriteria:
    - 显示用户最近5条查询记录。
    - 包含出发地、目的地、查询日期信息。
    - 点击历史记录自动填充查询表单。
    - 支持清空所有历史记录。
    - 仅登录用户显示。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持搜索历史功能。"

- type: Frontend
  id: UI-ServiceEntries
  description: 服务功能入口组件，包含各种便民服务。
  properties:
    - name: onServiceClick
      type: function
      description: "点击服务入口的回调函数。"
    - name: layout
      type: string
      description: "布局方式：grid或list，默认grid。"
  state:
    - services
    - expandedCategories
  dependencies:
    - API-GET-SystemConfig
  acceptanceCriteria:
    - 包含重点旅客服务、失物招领、汽车票等服务入口。
    - 支持分类展示和收起/展开功能。
    - 每个服务显示图标、标题和简短描述。
    - 支持外部链接跳转和内部页面导航。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持服务功能入口。"

- type: Frontend
  id: UI-SystemNotice
  description: 系统公告组件，显示重要通知和维护信息。
  properties:
    - name: onNoticeClick
      type: function
      description: "点击公告的回调函数。"
    - name: autoClose
      type: boolean
      description: "是否自动关闭，默认false。"
  state:
    - notices
    - currentNotice
    - isVisible
    - autoPlayTimer
  dependencies:
    - API-GET-SystemConfig
  acceptanceCriteria:
    - 显示系统公告、维护通知等重要信息。
    - 支持轮播显示多条公告。
    - 包含关闭按钮和详情查看功能。
    - 根据公告优先级决定显示样式。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持系统公告显示。"

- type: Frontend
  id: UI-HomePage
  description: 首页主容器组件，整合所有首页功能模块。
  properties:
    - name: initialData
      type: object
      description: "页面初始数据。"
    - name: onNavigate
      type: function
      description: "页面导航的回调函数。"
  state:
    - userInfo
    - pageLoading
    - searchParams
    - activeTab
  dependencies:
    - UI-HomeHeader
    - UI-TicketQueryForm
    - UI-QuickAccess
    - UI-HotRoutes
    - UI-SearchHistory
    - UI-ServiceEntries
    - UI-SystemNotice
    - API-GET-UserStatus
    - API-GET-SystemConfig
  acceptanceCriteria:
    - 整合所有首页功能模块，提供统一的数据管理。
    - 支持响应式布局，适配桌面端和移动端。
    - 处理页面级的状态管理和数据流。
    - 提供良好的加载状态和错误处理。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建，支持首页整体功能。"

- type: Frontend
  id: UI-LoginForm
  description: 用户登录表单组件，支持手机号/邮箱+密码登录方式。
  properties:
    - name: onLoginSuccess
      type: function
      description: "登录成功后的回调函数。"
    - name: onLoginError
      type: function
      description: "登录失败时的错误处理回调。"
    - name: showCaptcha
      type: boolean
      description: "是否显示图形验证码。"
  state:
    - account
    - password
    - captcha
    - isLoading
    - errors
    - loginAttempts
  dependencies:
    - API-POST-Login
  acceptanceCriteria:
    - 组件应渲染账号（手机号/邮箱）、密码输入框和登录按钮。
    - 支持记住账号功能，使用localStorage存储。
    - 登录失败超过3次时显示图形验证码。
    - 当isLoading状态为true时，登录按钮应被禁用并显示加载状态。
    - 提供"忘记密码"链接跳转到密码重置页面。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-ResetPasswordForm
  description: 密码重置表单组件，通过手机验证码重置密码。
  properties:
    - name: onResetSuccess
      type: function
      description: "密码重置成功后的回调函数。"
    - name: onResetError
      type: function
      description: "密码重置失败时的错误处理回调。"
  state:
    - phoneNumber
    - verificationCode
    - newPassword
    - confirmPassword
    - isLoading
    - errors
    - codeCountdown
  dependencies:
    - API-POST-ResetPassword
    - API-POST-SendVerificationCode
  acceptanceCriteria:
    - 组件应渲染手机号、验证码、新密码、确认密码输入框。
    - 点击获取验证码按钮时启动60秒倒计时。
    - 验证新密码强度和确认密码一致性。
    - 重置成功后跳转到登录页面。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

# 车票查询相关UI组件
- type: Frontend
  id: UI-TrainSearchForm
  description: 车票查询表单组件，提供出发地、目的地、日期等查询条件。
  properties:
    - name: onSearch
      type: function
      description: "执行搜索时的回调函数。"
    - name: onSwapStations
      type: function
      description: "交换出发地和目的地的回调函数。"
  state:
    - fromStation
    - toStation
    - departDate
    - returnDate
    - passengerCount
    - isLoading
    - stationSuggestions
  dependencies:
    - API-GET-QueryTrains
  acceptanceCriteria:
    - 组件应渲染出发地、目的地选择器和出发日期选择器。
    - 支持站点名称自动补全和搜索建议。
    - 提供出发地和目的地快速交换功能。
    - 日期选择器应限制可选择的日期范围（如未来60天）。
    - 支持往返票查询（可选返程日期）。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-TrainList
  description: 车次列表组件，展示查询结果并支持筛选和排序。
  properties:
    - name: trains
      type: array
      description: "车次数据列表。"
    - name: onSelectTrain
      type: function
      description: "选择车次时的回调函数。"
    - name: onLoadMore
      type: function
      description: "加载更多数据的回调函数。"
  state:
    - filteredTrains
    - sortBy
    - filterOptions
    - isLoading
    - hasMore
  dependencies:
    - API-GET-QueryTrains
    - API-GET-TrainDetail
  acceptanceCriteria:
    - 以列表形式展示车次信息，包括车次号、发车时间、到达时间、历时、余票、票价。
    - 支持按车次类型、发车时间、票价等条件筛选。
    - 支持按发车时间、历时、票价等字段排序。
    - 实时显示余票信息，余票不足时给出提示。
    - 支持分页加载或无限滚动加载更多数据。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-TrainDetailModal
  description: 车次详情弹窗组件，显示车次的详细信息和座位分布。
  properties:
    - name: trainId
      type: string
      description: "车次ID。"
    - name: visible
      type: boolean
      description: "弹窗是否可见。"
    - name: onClose
      type: function
      description: "关闭弹窗的回调函数。"
    - name: onBookTicket
      type: function
      description: "预订车票的回调函数。"
  state:
    - trainDetail
    - selectedSeatType
    - isLoading
  dependencies:
    - API-GET-TrainDetail
  acceptanceCriteria:
    - 显示车次的完整信息，包括停靠站点和时刻表。
    - 展示座位分布图和各座位等级的余票情况。
    - 提供座位等级选择和预订功能。
    - 支持关闭弹窗和跳转到订票页面。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

