      type: function
      description: "支付成功的回调函数。"
    - name: onPaymentError
      type: function
      description: "支付失败的回调函数。"
    - name: onClose
      type: function
      description: "关闭弹窗的回调函数。"
  state:
    - paymentMethod
    - paymentUrl
    - qrCode
    - countdown
    - isLoading
    - paymentStatus
  dependencies:
