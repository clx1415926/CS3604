# 12306铁路系统前端UI接口库
# 版本: v1.0
# 创建日期: 2025-01-18

# 用户认证相关UI组件
- type: Frontend
  id: UI-RegisterForm
  description: 用户注册表单组件，处理用户注册流程包括信息填写和验证码验证。
  properties:
    - name: onRegisterSuccess
      type: function
      description: "注册成功后的回调函数。"
    - name: onRegisterError
      type: function
      description: "注册失败时的错误处理回调。"
    - name: initialValues
      type: object
      description: "表单初始值，用于编辑模式。"
  state:
    - phoneNumber
    - email
    - verificationCode
    - password
    - confirmPassword
    - realName
    - idCard
    - isLoading
    - errors
    - codeCountdown
  dependencies:
    - API-POST-Register
    - API-POST-SendVerificationCode
  acceptanceCriteria:
    - 组件应渲染手机号、邮箱、验证码、密码、确认密码、真实姓名、身份证号输入框。
    - 点击获取验证码按钮时，应调用发送验证码API并启动60秒倒计时。
    - 点击注册按钮时，应验证所有必填字段并调用注册API。
    - 当isLoading状态为true时，注册按钮应被禁用并显示加载状态。
    - 实时验证输入格式，如手机号、邮箱、身份证号格式。
    - 密码强度检查和确认密码一致性验证。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-LoginForm
  description: 用户登录表单组件，支持手机号/邮箱+密码登录方式。
  properties:
    - name: onLoginSuccess
      type: function
      description: "登录成功后的回调函数。"
    - name: onLoginError
      type: function
      description: "登录失败时的错误处理回调。"
    - name: showCaptcha
      type: boolean
      description: "是否显示图形验证码。"
  state:
    - account
    - password
    - captcha
    - isLoading
    - errors
    - loginAttempts
  dependencies:
    - API-POST-Login
  acceptanceCriteria:
    - 组件应渲染账号（手机号/邮箱）、密码输入框和登录按钮。
    - 支持记住账号功能，使用localStorage存储。
    - 登录失败超过3次时显示图形验证码。
    - 当isLoading状态为true时，登录按钮应被禁用并显示加载状态。
    - 提供"忘记密码"链接跳转到密码重置页面。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-ResetPasswordForm
  description: 密码重置表单组件，通过手机验证码重置密码。
  properties:
    - name: onResetSuccess
      type: function
      description: "密码重置成功后的回调函数。"
    - name: onResetError
      type: function
      description: "密码重置失败时的错误处理回调。"
  state:
    - phoneNumber
    - verificationCode
    - newPassword
    - confirmPassword
    - isLoading
    - errors
    - codeCountdown
  dependencies:
    - API-POST-ResetPassword
    - API-POST-SendVerificationCode
  acceptanceCriteria:
    - 组件应渲染手机号、验证码、新密码、确认密码输入框。
    - 点击获取验证码按钮时启动60秒倒计时。
    - 验证新密码强度和确认密码一致性。
    - 重置成功后跳转到登录页面。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

# 车票查询相关UI组件
- type: Frontend
  id: UI-TrainSearchForm
  description: 车票查询表单组件，提供出发地、目的地、日期等查询条件。
  properties:
    - name: onSearch
      type: function
      description: "执行搜索时的回调函数。"
    - name: onSwapStations
      type: function
      description: "交换出发地和目的地的回调函数。"
  state:
    - fromStation
    - toStation
    - departDate
    - returnDate
    - passengerCount
    - isLoading
    - stationSuggestions
  dependencies:
    - API-GET-QueryTrains
  acceptanceCriteria:
    - 组件应渲染出发地、目的地选择器和出发日期选择器。
    - 支持站点名称自动补全和搜索建议。
    - 提供出发地和目的地快速交换功能。
    - 日期选择器应限制可选择的日期范围（如未来60天）。
    - 支持往返票查询（可选返程日期）。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-TrainList
  description: 车次列表组件，展示查询结果并支持筛选和排序。
  properties:
    - name: trains
      type: array
      description: "车次数据列表。"
    - name: onSelectTrain
      type: function
      description: "选择车次时的回调函数。"
    - name: onLoadMore
      type: function
      description: "加载更多数据的回调函数。"
  state:
    - filteredTrains
    - sortBy
    - filterOptions
    - isLoading
    - hasMore
  dependencies:
    - API-GET-QueryTrains
    - API-GET-TrainDetail
  acceptanceCriteria:
    - 以列表形式展示车次信息，包括车次号、发车时间、到达时间、历时、余票、票价。
    - 支持按车次类型、发车时间、票价等条件筛选。
    - 支持按发车时间、历时、票价等字段排序。
    - 实时显示余票信息，余票不足时给出提示。
    - 支持分页加载或无限滚动加载更多数据。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-TrainDetailModal
  description: 车次详情弹窗组件，显示车次的详细信息和座位分布。
  properties:
    - name: trainId
      type: string
      description: "车次ID。"
    - name: visible
      type: boolean
      description: "弹窗是否可见。"
    - name: onClose
      type: function
      description: "关闭弹窗的回调函数。"
    - name: onBookTicket
      type: function
      description: "预订车票的回调函数。"
  state:
    - trainDetail
    - selectedSeatType
    - isLoading
  dependencies:
    - API-GET-TrainDetail
  acceptanceCriteria:
    - 显示车次的完整信息，包括停靠站点和时刻表。
    - 展示座位分布图和各座位等级的余票情况。
    - 提供座位等级选择和预订功能。
    - 支持关闭弹窗和跳转到订票页面。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

# 订单管理相关UI组件
- type: Frontend
  id: UI-BookingForm
  description: 订票表单组件，处理乘客信息填写和座位选择。
  properties:
    - name: trainInfo
      type: object
      description: "选中的车次信息。"
    - name: onSubmitOrder
      type: function
      description: "提交订单时的回调函数。"
    - name: onAddPassenger
      type: function
      description: "添加乘客时的回调函数。"
  state:
    - selectedPassengers
    - seatType
    - seatNumbers
    - contactInfo
    - isLoading
    - errors
  dependencies:
    - API-POST-CreateOrder
    - API-GET-UserPassengers
  acceptanceCriteria:
    - 显示选中车次的基本信息。
    - 提供乘客选择功能，支持从常用联系人中选择或临时添加。
    - 支持座位等级选择和具体座位号选择（如果支持）。
    - 验证乘客信息的完整性和有效性。
    - 显示订单总价和提交订单按钮。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-OrderList
  description: 订单列表组件，展示用户的历史订单和当前订单。
  properties:
    - name: onViewDetail
      type: function
      description: "查看订单详情的回调函数。"
    - name: onRefund
      type: function
      description: "申请退票的回调函数。"
    - name: onReschedule
      type: function
      description: "申请改签的回调函数。"
  state:
    - orders
    - filterStatus
    - sortBy
    - isLoading
    - currentPage
  dependencies:
    - API-GET-UserOrders
  acceptanceCriteria:
    - 以列表或卡片形式展示订单信息。
    - 支持按订单状态筛选（全部、待支付、已支付、已取消、已退票）。
    - 显示订单的关键信息：车次、日期、乘客、状态、金额。
    - 提供订单操作按钮：查看详情、支付、退票、改签等。
    - 支持分页加载和下拉刷新。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-OrderDetail
  description: 订单详情组件，显示订单的完整信息。
  properties:
    - name: orderId
      type: string
      description: "订单ID。"
    - name: onPayment
      type: function
      description: "支付订单的回调函数。"
    - name: onRefund
      type: function
      description: "申请退票的回调函数。"
    - name: onReschedule
      type: function
      description: "申请改签的回调函数。"
  state:
    - orderDetail
    - isLoading
    - actionLoading
  dependencies:
    - API-GET-OrderDetail
  acceptanceCriteria:
    - 显示订单的完整信息：车次详情、乘客信息、座位信息、支付信息。
    - 根据订单状态显示相应的操作按钮。
    - 支持订单状态实时更新。
    - 提供电子客票下载或打印功能。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

# 支付相关UI组件
- type: Frontend
  id: UI-PaymentModal
  description: 支付弹窗组件，处理订单支付流程。
  properties:
    - name: orderId
      type: string
      description: "待支付的订单ID。"
    - name: amount
      type: number
      description: "支付金额。"
    - name: visible
      type: boolean
      description: "弹窗是否可见。"
    - name: onPaymentSuccess
      type: function
      description: "支付成功的回调函数。"
    - name: onPaymentError
      type: function
      description: "支付失败的回调函数。"
    - name: onClose
      type: function
      description: "关闭弹窗的回调函数。"
  state:
    - paymentMethod
    - paymentUrl
    - qrCode
    - countdown
    - isLoading
    - paymentStatus
  dependencies:
    - API-POST-CreatePayment
  acceptanceCriteria:
    - 显示订单金额和支付方式选择。
    - 支持支付宝、微信、银行卡等多种支付方式。
    - 根据支付方式显示相应的支付界面（二维码、跳转链接等）。
    - 显示支付倒计时（30分钟）。
    - 支持支付状态轮询和实时更新。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

# 乘客管理相关UI组件
- type: Frontend
  id: UI-PassengerList
  description: 常用联系人列表组件，管理用户的乘客信息。
  properties:
    - name: onAddPassenger
      type: function
      description: "添加新乘客的回调函数。"
    - name: onEditPassenger
      type: function
      description: "编辑乘客信息的回调函数。"
    - name: onDeletePassenger
      type: function
      description: "删除乘客的回调函数。"
    - name: selectable
      type: boolean
      description: "是否支持选择乘客（用于订票流程）。"
    - name: onSelectPassenger
      type: function
      description: "选择乘客时的回调函数。"
  state:
    - passengers
    - selectedPassengers
    - isLoading
    - editingPassenger
  dependencies:
    - API-GET-UserPassengers
    - API-DELETE-RemovePassenger
  acceptanceCriteria:
    - 以列表形式展示所有常用联系人。
    - 显示乘客的基本信息：姓名、证件类型、证件号、乘客类型。
    - 提供添加、编辑、删除乘客的操作按钮。
    - 在订票流程中支持多选乘客功能。
    - 支持乘客信息的搜索和筛选。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-PassengerForm
  description: 乘客信息表单组件，用于添加或编辑乘客信息。
  properties:
    - name: passenger
      type: object
      description: "乘客信息（编辑模式时传入）。"
    - name: onSave
      type: function
      description: "保存乘客信息的回调函数。"
    - name: onCancel
      type: function
      description: "取消操作的回调函数。"
  state:
    - name
    - idCard
    - phoneNumber
    - passengerType
    - idType
    - isLoading
    - errors
  dependencies:
    - API-POST-AddPassenger
    - API-PUT-UpdatePassenger
  acceptanceCriteria:
    - 组件应渲染姓名、证件类型、证件号、手机号、乘客类型等输入框。
    - 实时验证输入格式，特别是身份证号格式。
    - 支持不同证件类型的选择（身份证、护照、港澳通行证等）。
    - 根据乘客类型（成人、儿童、学生）调整表单字段。
    - 保存成功后关闭表单并刷新乘客列表。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

# 退改签相关UI组件
- type: Frontend
  id: UI-RefundModal
  description: 退票弹窗组件，处理退票申请流程。
  properties:
    - name: order
      type: object
      description: "要退票的订单信息。"
    - name: visible
      type: boolean
      description: "弹窗是否可见。"
    - name: onRefundSuccess
      type: function
      description: "退票成功的回调函数。"
    - name: onClose
      type: function
      description: "关闭弹窗的回调函数。"
  state:
    - selectedPassengers
    - refundReason
    - refundAmount
    - refundFee
    - isLoading
  dependencies:
    - API-POST-RefundTicket
  acceptanceCriteria:
    - 显示订单信息和可退票的乘客列表。
    - 支持全部退票或部分退票（选择特定乘客）。
    - 实时计算退票费用和退款金额。
    - 提供退票原因选择或填写。
    - 显示退票规则和注意事项。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

- type: Frontend
  id: UI-RescheduleModal
  description: 改签弹窗组件，处理改签申请流程。
  properties:
    - name: order
      type: object
      description: "要改签的订单信息。"
    - name: visible
      type: boolean
      description: "弹窗是否可见。"
    - name: onRescheduleSuccess
      type: function
      description: "改签成功的回调函数。"
    - name: onClose
      type: function
      description: "关闭弹窗的回调函数。"
  state:
    - newTrainId
    - newDepartDate
    - newSeatType
    - selectedPassengers
    - priceDiff
    - availableTrains
    - isLoading
  dependencies:
    - API-POST-RescheduleTicket
    - API-GET-QueryTrains
  acceptanceCriteria:
    - 显示原订单信息和可改签的乘客列表。
    - 提供新车次查询和选择功能。
    - 实时显示改签费用差额。
    - 支持部分改签（选择特定乘客）。
    - 显示改签规则和限制条件。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"

# 用户信息管理相关UI组件
