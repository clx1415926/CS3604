- type: Frontend
  id: UI-ErrorBoundary
  description: 错误边界组件，捕获和处理组件错误。
  properties:
    - name: fallback
      type: component
      description: "错误时显示的备用组件。"
    - name: onError
      type: function
      description: "错误发生时的回调函数。"
  state:
    - hasError
    - errorInfo
  dependencies:
    - none
  acceptanceCriteria:
    - 捕获子组件中的JavaScript错误。
    - 显示友好的错误提示界面。
    - 记录错误信息用于调试。
    - 提供重试或刷新页面的选项。
  changeLog:
    - date: "2025-01-18"
      description: "初始创建。"